# .github/workflows/ci.yml — generated by /adopt-standards; language setup steps are inserted per profile.
name: ci
on:
  pull_request:
  push: { branches: [main] }
permissions: { contents: read }
concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/remeda
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # gitleaks binary via its official image: no token scopes needed, no license needed for org repos
      # (gitleaks-action v2 requires a paid key on organization repositories and pull-requests:read).
      - name: gitleaks
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 detect --source /repo --redact --no-banner --log-opts=--all
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
        working-directory: .
      - run: make install
      - run: make lint
      - run: make audit
      - run: make test
      - run: make e2e
