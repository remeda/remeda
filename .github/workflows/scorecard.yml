name: 🛡️ Scorecard supply-chain security
on:
  branch_protection_rule:
  schedule:
    - cron: "37 13 * * 3"
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    name: 🕵️ Scorecard analysis
    runs-on: ubuntu-latest
    if: github.repository == 'remeda/remeda'
    permissions:
      security-events: write # Upload the results to code-scanning dashboard.
      id-token: write # Publish results and get a badge.

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔍 Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: 🛡️ Upload to code-scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
