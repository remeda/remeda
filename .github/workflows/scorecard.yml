name: 🛡️ Scorecard supply-chain security
on:
  branch_protection_rule:
  schedule:
    - cron: "37 13 * * 3"
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    name: 🕵️ Scorecard analysis
    runs-on: ubuntu-latest
    if: github.repository == 'remeda/remeda'
    permissions:
      security-events: write # Upload the results to code-scanning dashboard.
      id-token: write # Publish results and get a badge.

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔍 Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: 🛡️ Upload to code-scanning
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: results.sarif
