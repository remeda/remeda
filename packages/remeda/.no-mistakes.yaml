# .no-mistakes.yaml — generated by adopt-standards. Gate-control fields are read from the DEFAULT branch.
allow_repo_commands: false   # set true only on a single-developer repo
agent: [claude, opencode]
commands:
  test: "npx vitest run"      # targeted validation, not CI-parity; narrow it as the repo grows
  lint: "npx eslint . && npx prettier --check ."
  format: "npx prettier --write ."
protected_paths:
  - ".github/**"
  - "*.lock"
  - "package-lock.json"
review:
  path_instructions:
    - path: "tests/**"
      instructions: |
        Flag any deleted, skipped, or weakened assertion as error severity, action ask-user.
    - path: "**"
      instructions: |
        Review against docs/STANDARDS.md and docs/SECURITY.md. Secrets, string-built queries/commands,
        missing auth on a route, and disabled security defaults are error severity, action ask-user.
document:
  instructions: |
    AGENTS.md owns conventions, escalation rules, and the Known-mistakes ledger. docs/specs/ owns decisions
    and specs. docs/STANDARDS.md and docs/SECURITY.md are kit-managed; propose changes, do not edit silently.
auto_fix: { review: 0, test: 2, lint: 3, document: 2, ci: 2 }
intent: { enabled: true }
test: { evidence: { attach_media: true, store_in_repo: false } }
